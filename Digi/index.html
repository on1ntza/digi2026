<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        html{
            height: 100%;
        }
        body{
            height: 100%;
        }

        nav li{
            display: inline;
            margin: 0 10px;
        }
        nav ul{
            text-align: center;
        }
        nav a{
            text-decoration: none;
            font-size: 24px;
        }
        header,footer{
            margin-left: auto;
            margin-right: auto;
            height: 10%;
            padding: 2%;
        }
        main, aside{
            height: 80%;
            float: left;
        }
        footer{
            clear: both;
        }

        main{
            width: 70%;
            margin-left: 15%;
            margin-right: 15%;
        }
        aside{
            width: 15%;
        }

        :root {
            --seim-dark: #071923;
            --seim-dark-2: #0d2733;
            --seim-blue: #00a8c6;
            --seim-blue-light: #38d4df;
            --seim-white: #ffffff;
            --seim-text: #dce9ed;
            --seim-muted: #9eb4ba;
            --seim-card: rgba(255, 255, 255, 0.08);
            --seim-border: rgba(255, 255, 255, 0.16);
            --success: #004b57;
            --danger: #fdb524;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--seim-text);
            line-height: 1.6;
            background:
                    radial-gradient(
                            circle at top right,
                            rgba(0, 168, 198, 0.18),
                            transparent 35%
                    ),
                    linear-gradient(
                            135deg,
                            var(--seim-dark),
                            #0a202b 55%,
                            #061219
                    );
        }

        /* Cabecera */

        .hero {
            position: relative;
            min-height: 440px;
            padding: 110px 24px 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            background:
                    linear-gradient(
                            110deg,
                            rgba(4, 18, 27, 0.98),
                            rgba(7, 46, 59, 0.88)
                    );
            border-bottom: 1px solid var(--seim-border);
        }

        .hero::before {
            content: "";
            position: absolute;
            width: 420px;
            height: 420px;
            right: -120px;
            top: -150px;
            border: 70px solid rgba(0, 168, 198, 0.17);
            border-radius: 50%;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 180px;
            height: 180px;
            right: 120px;
            bottom: -110px;
            border: 35px solid rgba(56, 212, 223, 0.12);
            border-radius: 50%;
        }

        .hero h1,
        .hero p {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero h1 {
            color: var(--seim-white);
            font-size: clamp(2.4rem, 6vw, 5.5rem);
            line-height: 1.05;
            letter-spacing: -2px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        .hero h1::first-line {
            color: var(--seim-blue-light);
        }

        .hero p {
            color: var(--seim-text);
            font-size: 1.12rem;
            margin-bottom: 5px;
        }

        .hero p:first-of-type {
            color: var(--seim-blue-light);
            font-weight: bold;
        }

        /* Introducción */

        .intro {
            max-width: 1100px;
            margin: 0 auto;
            padding: 90px 24px 55px;
        }

        .intro h2 {
            color: var(--seim-white);
            font-size: clamp(2rem, 4vw, 3.3rem);
            line-height: 1.1;
            margin-bottom: 30px;
        }

        .intro h2::after {
            content: "";
            display: block;
            width: 65px;
            height: 4px;
            margin-top: 18px;
            background: var(--seim-blue);
            border-radius: 10px;
        }

        .intro p {
            max-width: 850px;
            color: var(--seim-muted);
            font-size: 1.05rem;
            margin-bottom: 18px;
        }

        .intro strong {
            color: var(--seim-white);
        }

        /* Listado */

        .portfolio-section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 25px 24px 90px;
        }

        .container h2 {
            color: var(--seim-white);
            font-size: clamp(1.7rem, 3vw, 2.6rem);
            margin-bottom: 32px;
        }

        .container h2::first-letter {
            color: var(--seim-blue-light);
        }

        .portfolio-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
            list-style: none;
            counter-reset: portfolios;
        }

        .portfolio-list li {
            counter-increment: portfolios;
            position: relative;
        }

        .portfolio-list li a,
        .portfolio-list li.unavailable {
            min-height: 74px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 22px 18px 70px;
            position: relative;
            border-radius: 4px;
        }

        .portfolio-list li a {
            color: var(--seim-white);
            text-decoration: none;
            background: var(--seim-card);
            border: 1px solid var(--seim-border);
            border-left: 3px solid var(--success);
            transition:
                    transform 0.25s ease,
                    background 0.25s ease,
                    border-color 0.25s ease,
                    box-shadow 0.25s ease;
        }

        .portfolio-list li a::before,
        .portfolio-list li.unavailable::before {
            content: counter(portfolios, decimal-leading-zero);
            position: absolute;
            left: 22px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .portfolio-list li a::before {
            color: var(--seim-blue-light);
        }

        .portfolio-list li a:hover {
            transform: translateY(-5px);
            background: rgba(0, 168, 198, 0.16);
            border-color: var(--seim-blue);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .status {
            margin-left: auto;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .portfolio-list li.unavailable {
            color: var(--seim-muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-left: 3px solid var(--danger);
            opacity: 0.7;
        }

        .portfolio-list li.unavailable::before {
            color: var(--danger);
        }

        /* Pie de página */

        footer {
            padding: 55px 24px;
            text-align: center;
            background: #041017;
            border-top: 1px solid var(--seim-border);
        }

        footer::before {
            content: "";
            display: block;
            width: 55px;
            height: 4px;
            margin: 0 auto 25px;
            background: var(--seim-blue);
            border-radius: 10px;
        }

        footer p {
            color: var(--seim-muted);
            margin: 4px 0;
        }

        footer p:first-of-type {
            color: var(--seim-white);
            font-size: 1.1rem;
        }

        footer strong {
            color: var(--seim-blue-light);
        }

        /* Responsive */

        @media (max-width: 760px) {
            .hero {
                min-height: 380px;
                padding: 85px 22px 65px;
            }

            .hero h1 {
                letter-spacing: -1px;
            }

            .intro {
                padding-top: 65px;
            }

            .portfolio-list {
                grid-template-columns: 1fr;
            }

            .portfolio-list li a,
            .portfolio-list li.unavailable {
                padding-left: 62px;
            }
        }

        nav li a {
            color: var(--seim-white);
            text-decoration: none;
            background: var(--seim-card);
            border: 1px solid var(--seim-border);
            border-left: 3px solid var(--success);
            transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        }

        nav li a:hover {
            transform: translateY(-5px);
            background: rgba(0, 168, 198, 0.16);
            border-color: var(--seim-blue);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        @media (max-width: 420px) {
            .hero h1 {
                font-size: 2.4rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .container h2 {
                font-size: 1.6rem;
            }

            .portfolio-list li a,
            .portfolio-list li.unavailable {
                padding: 16px 15px 16px 54px;
                font-size: 0.95rem;
            }

            .portfolio-list li a::before,
            .portfolio-list li.unavailable::before {
                left: 16px;
            }

        }
        h1 span{
            color: var(--seim-blue-light);
        }
        #ejercicios, #contenedor{
            margin: 2%;
        }

    </style>
</head>
<body>
<header>
    <nav>
        <ul>
            <li><a href="../">Todos los portfolios</a></li>
            <li><a href="../LM/">Lenguajes de Marcas</a></li>
            <li><a href="../Digi/">Digitalización</a></li>
        </ul>
    </nav>
</header>

<main>

    <h1>D<span>i</span>gitalizaci<span>ó</span>n - O<span>n</span>intza A<span>r</span>acama</h1>
    <div id="ejercicios">
        <h2>Entregables de digitalización</h2>
    </div>
    <div id="contenedor">
        <div>
            <ol class="portfolio-list">
                <li>
                    <h2>Ejercicio1: Curriculum</h2>

                    <h3><a href="./CV/Curriculum.html">Curriculum</a></h3>
                </li>
            </ol>
        </div>

    </div>
</main>

<footer>
    <ul>
        <li><a href="">Youtube</a></li>
        <li><a href="">Instagram</a></li>
        <li><a href="">X</a></li>
    </ul>
</footer>
</body>
</html>
